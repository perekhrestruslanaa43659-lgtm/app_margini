<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot Calendario</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f5f7;
      --border: #dfe1e6;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #1f7a5a;
      --accent-text: #ffffff;
      --danger: #b42318;
      --warn-bg: #fff6e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1f22;
        --surface: #2a2c30;
        --border: #3b3e44;
        --text: #e6e7e9;
        --muted: #9aa0a8;
        --accent: #3fae84;
        --accent-text: #0d1f17;
        --danger: #f97066;
        --warn-bg: #3a3220;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    main { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    button {
      font: inherit; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button.danger { color: var(--danger); }
    button.small { font-size: 12px; padding: 3px 8px; }
    textarea { resize: vertical; }
    input[type=text], input[type=date], input[type=search], select, textarea {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 100%;
    }
    .row { display: flex; gap: 6px; }
    .row > input { flex: 1; min-width: 0; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); }
    .card h2 { font-size: 14px; margin: 0 0 6px; }
    .card h3 { font-size: 13px; margin: 0 0 4px; }
    .card.free { background: var(--surface); }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 13px; margin-bottom: 8px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-word; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; font-size: 13px; }
    .field label { color: var(--muted); }
    .checks { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
    .preview ul { margin: 0 0 8px; padding-left: 18px; font-size: 13px; }
    .preview .old { color: var(--muted); text-decoration: line-through; }
    .warn { background: var(--warn-bg); border-radius: 6px; padding: 6px 8px; font-size: 12px; margin-bottom: 8px; }
    .hint { color: var(--muted); font-size: 12px; }
    #msg { font-size: 13px; min-height: 1em; }
    #msg.error { color: var(--danger); }
    .result { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Bot Calendario</h1>
    <button id="undo" class="small" disabled title="Ripristina le celle com'erano prima dell'ultima modifica confermata">Annulla ultima</button>
  </header>
  <main>
    <div class="card" id="aiBox">
      <h3>Scrivi la richiesta</h3>
      <textarea id="ask" rows="2" placeholder="es. metti Rossi il 12/11 alle 20:30, 30 pax, sala verde, menu 35"></textarea>
      <div class="actions" style="margin-top:6px">
        <button id="askGo" class="primary">Compila</button>
        <span id="aiStatus" class="hint"></span>
      </div>
    </div>
    <div>
      <div class="row">
        <input id="date" type="date" aria-label="Data">
        <button id="show" class="primary">Mostra</button>
      </div>
    </div>
    <div>
      <div class="row">
        <input id="q" type="search" placeholder="Cerca cliente, mail, menu…" aria-label="Cerca">
        <button id="search">Cerca</button>
      </div>
    </div>
    <div id="msg"></div>
    <div id="panel"></div>
    <p class="hint">I dati restano nel file: il pannello lavora solo dentro Excel. La richiesta scritta va solo all'AI installata su questo PC (Ollama), mai a server esterni; il contenuto del calendario non viene mai mandato all'AI.</p>
  </main>
  <script src="taskpane.js"></script>
</body>
</html>
